name: Attio Connector Deploy
on:
  workflow_run:
    workflows: [Attio Connector CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: attio-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy connector to Frankfurt
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: attio-production
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PROJECT: ontora-twenty-crm-prod
      ZONE: europe-west3-a
      INSTANCE: crm-prod
      RELEASE: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      WIF_PROVIDER: ${{ vars.ATTIO_GCP_WIF_PROVIDER }}
      DEPLOY_ACCOUNT: ${{ vars.ATTIO_GCP_DEPLOY_ACCOUNT }}
    steps:
      - name: Require deployment identity
        run: |
          test -n "$WIF_PROVIDER" || { echo '::error::Configure ATTIO_GCP_WIF_PROVIDER in attio-production'; exit 1; }
          test -n "$DEPLOY_ACCOUNT" || { echo '::error::Configure ATTIO_GCP_DEPLOY_ACCOUNT in attio-production'; exit 1; }
          [[ "$RELEASE" =~ ^[a-f0-9]{40}$ && "$RUN_ID" =~ ^[0-9]+$ ]]
      - name: Refuse superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: test "$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)" = "$RELEASE"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: attio-release-${{ github.event.workflow_run.head_sha }}
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify release checksums
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          test "$(cat revision)" = "$RELEASE"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.ATTIO_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.ATTIO_GCP_DEPLOY_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Upload and install without running a sync
        run: |
          remote_directory="attio-release-$RELEASE-$RUN_ID"
          gcloud compute scp --quiet --tunnel-through-iap --project "$PROJECT" --zone "$ZONE" --recurse release "$INSTANCE:~/$remote_directory"
          gcloud compute ssh --quiet --tunnel-through-iap --project "$PROJECT" --zone "$ZONE" "$INSTANCE" \
            --command "sudo bash ~/$remote_directory/install-release.sh ~/$remote_directory $RELEASE"
          printf '### Connector deployed\n\nCommit: `%s`\n\nTarget: `%s / %s / %s`\n\nNo CRM sync was started.\n' "$RELEASE" "$PROJECT" "$ZONE" "$INSTANCE" >> "$GITHUB_STEP_SUMMARY"
